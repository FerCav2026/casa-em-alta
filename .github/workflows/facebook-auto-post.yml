name: Publica artigos novos no Facebook

on:
  schedule:
    # roda 1x por dia, às 18h de Brasília (21h UTC). Só publica de fato nos dias
    # em que algum blog tiver artigo novo — nos outros dias não faz nada.
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configura git
        run: |
          git config user.name "facebook-auto-post-bot"
          git config user.email "actions@github.com"

      - name: Publica artigos novos no Facebook (Casa em Alta, Indica Casa, Mundo dos Sobrenomes)
        env:
          FB_TOKEN_CASA_EM_ALTA: ${{ secrets.FB_TOKEN_CASA_EM_ALTA }}
          FB_TOKEN_INDICA_CASA: ${{ secrets.FB_TOKEN_INDICA_CASA }}
          FB_TOKEN_MUNDO_SOBRENOMES: ${{ secrets.FB_TOKEN_MUNDO_SOBRENOMES }}
        run: node scripts/facebook-auto-post.mjs

      - name: Salva o estado atualizado
        run: |
          if ! git diff --quiet -- state/facebook-posted.json; then
            git add state/facebook-posted.json
            git commit -m "chore: atualiza artigos já publicados no Facebook"
            git push
          else
            echo "Nada novo para commitar."
          fi
